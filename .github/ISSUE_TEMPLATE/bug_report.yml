name: Bug report
description: A tool failed or returned wrong data
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool, e.g. food_find_cheapest
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Arguments and result
      description: The arguments the agent sent and the error or wrong output. Remove anything personal.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: e.g. the magnitude or time shown on the USGS or EMSC site for the same event
  - type: input
    id: client
    attributes:
      label: MCP client and OS
      placeholder: Claude Desktop 1.x on Windows 11
  - type: dropdown
    id: network
    attributes:
      label: Network
      description: USGS and EMSC are reachable from most networks.
      options:
        - Direct connection
        - VPN or proxy
        - IRAN_QUAKE_MCP_PROXY set
  - type: input
    id: version
    attributes:
      label: iran-quake-mcp version
      placeholder: "0.1.0"
